spring.application.name=approval-service
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/approval_db}
spring.datasource.username=${DB_USERNAME:approval_user}
spring.datasource.password=${DB_PASSWORD:approval_local}
# Fail fast when the database is unreachable so that the readiness probe answers quickly
spring.datasource.hikari.connection-timeout=5000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management.server.port=${MANAGEMENT_PORT:9083}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kafka
