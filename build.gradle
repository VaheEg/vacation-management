plugins {
	// Puts the convention plugins and the plugins they bring (Spotless) on the root classpath.
	id 'vms.java-library' apply false
}

apply plugin: 'com.diffplug.spotless'

// Formats the build scripts that belong to no module: the root ones and build-logic.
spotless {
	groovyGradle {
		target '*.gradle', 'build-logic/*.gradle', 'build-logic/src/**/*.gradle'
		greclipse(libs.versions.greclipse.get())
	}
}
